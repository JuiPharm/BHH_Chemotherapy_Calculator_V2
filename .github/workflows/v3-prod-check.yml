name: Production Workflow Syntax Check
on:
  push:
    branches: [production-v3-live]
    paths: ['.github/workflows/v3-prod-check.yml']
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diagnose deployment workflow syntax (no Cloudflare writes)
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/v3-production-launch.yml .github/workflows/v3-staging.yml || true
          echo ACTIONLINT_DIAGNOSTIC_COMPLETED
