name: Deploy V3 Staging — Public Calculator and PIN Editor
on:
  # ONE-TIME owner-requested isolated V3 Staging deploy; remove after triggering.
  push:
    branches: [staging-internal-auth-v3]
    paths: ['.github/workflows/v3-staging.yml']
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type DEPLOY_STAGING_ONLY to approve remote staging migrations and Worker deployment'
        required: true
        type: string
      editor_email:
        description: 'One named STAGING editor email for PIN-only Draft entry (no Reviewer/Publish rights)'
        required: true
        default: 'editor.staging@example.invalid'
        type: string
permissions:
  contents: read
concurrency:
  group: bhh-v3-cloudflare-staging-release
  cancel-in-progress: false
jobs:
  staging:
    if: github.ref_name == 'staging-internal-auth-v3' && ((github.event_name == 'workflow_dispatch' && inputs.approval == 'DEPLOY_STAGING_ONLY') || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: 3229fd47f39f8ca1809f92d4282b5ab5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGING_PASSWORD_PEPPER: ${{ secrets.STAGING_PASSWORD_PEPPER }}
      STAGING_EDITOR_PIN: ${{ secrets.STAGING_EDITOR_PIN }}
      STAGING_REVIEWER_PIN: ${{ secrets.STAGING_REVIEWER_PIN }}
      STAGING_EDITOR_EMAIL: ${{ inputs.editor_email || vars.STAGING_EDITOR_EMAIL || 'JuiPharm@users.noreply.github.com' }}
      STAGING_REVIEWER_EMAIL: ${{ vars.STAGING_REVIEWER_EMAIL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Fail closed unless separate staging credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$STAGING_PASSWORD_PEPPER" ] || [ -z "$STAGING_EDITOR_PIN" ] || [ -z "$STAGING_REVIEWER_PIN" ]; then
            echo "::error::Set GitHub encrypted staging secrets CLOUDFLARE_API_TOKEN, STAGING_PASSWORD_PEPPER, STAGING_EDITOR_PIN and STAGING_REVIEWER_PIN first."
            exit 1
          fi
          node -e "const e=(process.env.STAGING_EDITOR_EMAIL||'').trim().toLowerCase(),r=(process.env.STAGING_REVIEWER_EMAIL||'').trim().toLowerCase();if (!/^[0-9]{10}$/.test(process.env.STAGING_EDITOR_PIN) || !/^[0-9]{10}$/.test(process.env.STAGING_REVIEWER_PIN) || process.env.STAGING_EDITOR_PIN===process.env.STAGING_REVIEWER_PIN || process.env.STAGING_PASSWORD_PEPPER.length<32 || !/^[^@ ]+@[^@ ]+[.][^@ ]+$/.test(e) || !/^[^@ ]+@[^@ ]+[.][^@ ]+$/.test(r) || r.endsWith('@example.invalid') || e===r) {console.error('Staging Editor and independent named Reviewer identities and distinct PINs required BEFORE any remote writes');process.exit(1)}"
      - name: Verify Cloudflare token is valid for target Staging D1 before lengthy tests
        run: |
          node --input-type=module -e "
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database';
          let res;
          try{res=await fetch(url,{headers:{Authorization:'Bearer '+token}})}
          catch{throw Error('Cloudflare API unreachable. No deployment performed.')}
          let data={};
          try{data=await res.json()}catch{}
          if(!res.ok||!data.success){
            console.error('Cloudflare token authentication or D1 scope failed. Recreate CLOUDFLARE_API_TOKEN as an account-scoped API token with D1 read/edit and Workers deploy rights, and replace only the GitHub Actions secret. No migrations or deploy attempted.');
            process.exit(1);
          }
          console.log('Cloudflare staging account API token accepted for D1 listing');
          "
      - run: npm ci
      - name: Block known high/critical dependency advisories
        run: npm audit --audit-level=high
      - name: Validate V2 and V3, including independent staging login
        run: |
          npm test
          npm run import:v3
          npm run build:v3
          npm run test:v3
          npm run test:api:v3
          npm run test:browser:v3
          npm run test:staging:v3
          npm run check:deploy:v3
      - name: Public Calculator and editor-PIN Browser UAT before remote changes
        run: |
          CODESPACE_NAME=deploy-local-smoke bash .devcontainer/start-preview.sh
          trap 'kill -TERM "$(cat v3/.staging-secrets/codespaces-preview.pid)" 2>/dev/null || true' EXIT
          TEST_BASE_URL=http://127.0.0.1:8792 node node_modules/@playwright/test/cli.js test --config v3/playwright.public.config.mjs
          TEST_BASE_URL=http://127.0.0.1:8792 node v3/tests/staging-pin-publication.mjs
      - name: Verify exact staging D1 config (never production)
        run: |
          node --input-type=module -e "import fs from 'node:fs';const j=JSON.parse(fs.readFileSync('v3/wrangler.jsonc','utf8')); const e=j.env.staging; if(e.name!=='bhh-chemotherapy-v3-staging'||e.d1_databases?.[0]?.database_name!=='bhh-chemo-staging'||e.d1_databases?.[0]?.database_id!=='3d936db6-eed1-4880-9561-1f22101cb27e'||e.vars.PUBLIC_CALCULATOR!=='true'||e.vars.AUTH_MODE!=='internal'||j.name===e.name)process.exit(1);"
      - name: Verify remote Cloudflare D1 UUID and staging name BEFORE any writes
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/bhh-d1-list.json"
          node --input-type=module -e "
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/bhh-d1-list.json','utf8'));
          if(!Array.isArray(d) ||
            !d.some(x=>(x.uuid||x.id)==='3d936db6-eed1-4880-9561-1f22101cb27e' && x.name==='bhh-chemo-staging'))
            throw Error('Remote database identity mismatch. Deployment blocked to protect Production.');
          console.log('Dedicated staging D1 UUID/name verified via Cloudflare account');
          "
      - name: Apply schema to existing isolated staging D1 ONLY
        run: npx wrangler d1 migrations apply DB --config v3/wrangler.jsonc --env staging --remote
      - name: Deploy separate staging Worker (never bhh or production Worker)
        run: npm run deploy:staging:v3
      - name: Set credential HMAC pepper as staging-only encrypted Worker Secret
        run: |
          printf '%s' "$STAGING_PASSWORD_PEPPER" | npx wrangler secret put STAGING_PASSWORD_PEPPER --config v3/wrangler.jsonc --env staging
      - name: Provision one named Draft-only PIN editor (no shared PIN)
        run: |
          trap 'rm -f "$RUNNER_TEMP/bhh-staging-editor-pin.sql"' EXIT
          node v3/scripts/provision-staging-editor-ci.mjs
          npx wrangler d1 execute DB --config v3/wrangler.jsonc --env staging --remote --file "$RUNNER_TEMP/bhh-staging-editor-pin.sql"
      - name: Provision distinct individual Oncology Reviewer PIN for Approve and Publish
        run: |
          trap 'rm -f "$RUNNER_TEMP/bhh-staging-reviewer-pin.sql"' EXIT
          node v3/scripts/provision-staging-reviewer-ci.mjs
          npx wrangler d1 execute DB --config v3/wrangler.jsonc --env staging --remote --file "$RUNNER_TEMP/bhh-staging-reviewer-pin.sql"
      - name: Live smoke — only published protocols visible without login
        run: |
          node --input-type=module -e "
          const origin='https://bhh-chemotherapy-v3-staging.juipharm.workers.dev';
          const session=await fetch(origin+'/api/session');
          if(!session.ok||(await session.json()).authMode!=='public')throw Error('Public calculator session failed');
          const catalog=await fetch(origin+'/api/catalog');
          if(!catalog.ok)throw Error('Published catalog unavailable');
          const list=(await catalog.json()).catalog;
          if(list.length<142||list.filter(x=>x.status==='published').length<6||list.some(x=>!['published','reference_only'].includes(x.status)))throw Error('Unexpected publication state');
          const blocked=await fetch(origin+'/api/registry');
          if(blocked.status!==403)throw Error('Unauthenticated registry must remain forbidden');
          console.log('STAGING LIVE SOURCE-CATALOG SMOKE PASS: minimum 6 Published; reference-only still protected; registry 403');
          "
