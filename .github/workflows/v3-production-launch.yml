name: BHH V3 One-time Isolated Production Launch
on:
  push:
    branches: [production-v3-live]
    paths: ['.github/workflows/v3-production-launch.yml']
permissions:
  contents: read
jobs:
  deploy:
    if: startsWith(github.event.head_commit.message, 'release(production): one-time standalone live')
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 3229fd47f39f8ca1809f92d4282b5ab5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_PASSWORD_PEPPER: ${{ secrets.PRODUCTION_PASSWORD_PEPPER }}
      PRODUCTION_EDITOR_PIN: ${{ secrets.PRODUCTION_EDITOR_PIN }}
      PRODUCTION_REVIEWER_PIN: ${{ secrets.PRODUCTION_REVIEWER_PIN }}
      PRODUCTION_EDITOR_EMAIL: ${{ vars.PRODUCTION_EDITOR_EMAIL || github.event.head_commit.author.email }}
      PRODUCTION_REVIEWER_EMAIL: ${{ vars.PRODUCTION_REVIEWER_EMAIL || secrets.PRODUCTION_REVIEWER_EMAIL }}
      PRODUCTION_D1_UUID: ${{ vars.PRODUCTION_D1_UUID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out exact release code
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify named independent Production roles before ANY remote changes
        run: node v3/scripts/preflight-production-ci.mjs
      - name: Install dependencies
        run: npm ci
      - name: Audit and validate existing V2
        run: |
          npm audit --audit-level=high
          npm test
      - name: Validate regimen import and V3 engine
        run: |
          npm run import:v3
          npm run build:v3
          npm run test:v3
          npm run test:api:v3
          npm run test:browser:v3
          npm run test:staging:v3
      - name: Verify protected local independent Editor and Reviewer publication
        run: |
          CODESPACE_NAME=production-local-check bash .devcontainer/start-preview.sh
          trap 'kill -TERM "$(cat v3/.staging-secrets/codespaces-preview.pid)" 2>/dev/null || true' EXIT
          TEST_BASE_URL=http://127.0.0.1:8792 node v3/tests/staging-pin-publication.mjs
      - name: Resolve only dedicated Production D1 ID and refuse mismatched existing database
        run: node v3/scripts/bootstrap-production-d1-ci.mjs
      - name: Verify isolated Production configuration and UUID
        run: npm run check:deploy:production:v3
      - name: Apply migrations only to dedicated Production D1
        run: npx wrangler d1 migrations apply DB --config v3/wrangler.jsonc --env production --remote
      - name: Deploy NEW isolated Worker
        run: npm run deploy:production:v3
      - name: Install distinct encrypted Production HMAC pepper
        run: printf '%s' "$PRODUCTION_PASSWORD_PEPPER" | npx wrangler secret put PRODUCTION_PASSWORD_PEPPER --config v3/wrangler.jsonc --env production
      - name: Provision named Production Editor and independent Oncology Reviewer
        run: |
          trap 'rm -f "$RUNNER_TEMP/bhh-production-named-operators.sql"' EXIT
          node v3/scripts/provision-production-staff-ci.mjs
          npx wrangler d1 execute DB --config v3/wrangler.jsonc --env production --remote --file "$RUNNER_TEMP/bhh-production-named-operators.sql"
      - name: Validate live central D1 and clinical workflow access
        run: node v3/scripts/production-live-smoke-ci.mjs
