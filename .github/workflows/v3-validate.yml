name: Validate V3 Cloudflare candidate
on:
  push:
    branches: [production-v3-cloudflare]
  pull_request:
    paths: ['v3/**', '.devcontainer/**', 'package*.json', '.github/workflows/v3-validate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Block known high/critical npm advisories (not a full security certification)
        run: |
          npm audit --json > /tmp/bhh-npm-audit.json || true
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('/tmp/bhh-npm-audit.json','utf8')); console.log('Audit totals:',JSON.stringify(d.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(d.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable})); if ((d.metadata?.vulnerabilities?.high||0)+(d.metadata?.vulnerabilities?.critical||0)>0) process.exit(1);"
      - name: Verify staging deployment configuration without deploying
        run: npm run check:deploy:v3
      - name: Preserve V2 regression checks
        run: npm test
      - name: Reproduce import and check structured engine
        run: |
          npm run import:v3
          npm run build:v3
          git diff --exit-code -- v3/migrations/0002_import.sql v3/docs/import-report.json v3/public/shared/clinical.js v3/public/sw.js
          npm run test:v3
      - name: Real local Worker and D1 API checks
        run: npm run test:api:v3
      - name: Browser workflow and offline tests
        run: npm run test:browser:v3
      - name: Full staging-mode authentication in isolated local Worker + D1 + Chromium
        run: npm run test:staging:v3
      - name: Browser-only Codespaces preview smoke (no deployment)
        run: |
          set -x
          CODESPACE_NAME=ci-bhh-synthetic bash .devcontainer/start-preview.sh
          CODESPACE_NAME=ci-bhh-synthetic bash .devcontainer/start-preview.sh
          test -s v3/.staging-secrets/CODESPACES_LOGIN.txt
          grep -q 'calculator@staging-fixture.test' v3/.staging-secrets/CODESPACES_LOGIN.txt
          test "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8792/login)" = '200'
          test "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8792/api/session)" = '401'
          target="https://ci-bhh-synthetic-8792.app.github.dev"
          test "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -H "Host: ci-bhh-synthetic-8792.app.github.dev" -H "Origin: $target" -H 'Content-Type: application/json' -H 'X-Requested-With: BHH-V3' --data '{"email":"calculator@staging-fixture.test"}' http://127.0.0.1:8792/api/auth/salt)" = '200'
          test "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -H "Host: ci-bhh-synthetic-8792.app.github.dev" -H "Origin: https://evil.example" -H 'Content-Type: application/json' -H 'X-Requested-With: BHH-V3' --data '{"email":"calculator@staging-fixture.test"}' http://127.0.0.1:8792/api/auth/salt)" = '403'
          test "$(curl -s --max-time 5 -D /tmp/codespaces-redirect.headers -o /dev/null -w '%{http_code}' -H 'Host: ci-bhh-synthetic-8792.app.github.dev' -H 'Accept: text/html' http://127.0.0.1:8792/)" = '303'
          cat /tmp/codespaces-redirect.headers
          grep -qi "^location: $target/login" /tmp/codespaces-redirect.headers
          kill -TERM "$(cat v3/.staging-secrets/codespaces-preview.pid)"
          echo "CODESPACES_LOCAL_PREVIEW_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-qa-evidence
          path: |
            v3/test-results/
            v3/v3/test-results/
