name: Validate and Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run production smoke tests
        run: node tests/production-smoke.mjs

      - name: Run production clinical and D1 safety tests
        run: |
          node tests/production-safety.mjs
          node tests/regimen-lifecycle.mjs
          node tests/rounding-security.mjs
          node tests/ckd-epi-2021.mjs

      - name: Syntax-check new modules
        run: |
          node --check renal-equations.js
          node --check regimen-builder.js
          node --check legacy-validator.js
          node --check functions/api/publish.js
          node --check functions/api/regimens.js
          node --check functions/api/verify-pin.js
          node --check src/server/clinical.js

      - name: Real browser production smoke
        run: node tests/browser-production-flow.mjs

      - name: Parse-check browser runtime
        run: node --check app.bundle.js

      - name: Validate Review and Publish module
        run: node --check publish-manager.js

      - name: Verify runtime startup and frontend contract
        run: node tests/runtime-startup-static.mjs

      - name: Verify static deployment files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.bundle.js
          test -f renal-equations.js
          test -f cleanup.js
          test -f manifest.json
          test -f data/regimens.published.json
          test -f data/rounding-profiles.json
          test -f data/legacy-regimens.v1.json
          test -f data/guideline-status.v2.4.json
          test -f publish-manager.js
          test -f publish-manager.css
          test -f .nojekyll

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html styles.css publish-manager.css publish-manager.js regimen-builder.js legacy-validator.js renal-equations.js manifest.json cleanup.js app.bundle.js 404.html .nojekyll _site/
          cp data/regimens.published.json data/rounding-profiles.json data/legacy-regimens.v1.json data/guideline-status.v2.4.json _site/data/
          test -s _site/data/guideline-status.v2.4.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
