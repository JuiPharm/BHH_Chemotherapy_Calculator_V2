name: Validate and Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run production smoke tests
        run: node tests/production-smoke.mjs

      - name: Verify static deployment files
        run: |
          test -f index.html
          test -f dist/app.js
          test -f dist/engine.js
          test -f data/regimens.published.json
          test -f data/rounding-profiles.json
          test -f .nojekyll

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/dist _site/data
          cp index.html styles.css manifest.json register-sw.js sw.js 404.html .nojekyll _site/
          cp dist/*.js _site/dist/
          cp data/regimens.published.json data/rounding-profiles.json _site/data/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
